name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN or CF_ACCOUNT_ID in repository Settings -> Secrets -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check types and run regression tests
        run: |
          npm run typecheck
          npm test

      # The repo's wrangler.toml is the source of truth (real DB/KV IDs and site
      # metadata). Secrets override them so forks can deploy to their own account.
      - name: Apply binding IDs from secrets
        run: |
          python3 - <<'PY'
          import os, re
          path = "wrangler.toml"
          text = open(path, encoding="utf-8").read()

          def set_binding(text, block, field, value):
              if not value:
                  return text
              pattern = re.compile(r'($$\[' + re.escape(block) + r'$$\][^$$]*?\b' + re.escape(field) + r'\s*=\s*)"[^"]*"')
              if pattern.search(text):
                  return pattern.sub(lambda m: m.group(1) + '"' + value + '"', text, count=1)
              return text + '\n[[' + block + ']]\nbinding = "' + ("DB" if block == "d1_databases" else ("IMAGES" if field == "images" else "PAGES")) + '"\n' + field + ' = "' + value + '"\n'

          text = set_binding(text, "d1_databases", "database_id", os.environ.get("D1_ID", ""))
          text = set_binding(text, "kv_namespaces", "id", os.environ.get("IMAGES_KV_ID", ""))
          if os.environ.get("PAGES_KV_ID"):
              parts = re.split(r'(\[\[kv_namespaces$$\])', text)
              idx = 0
              for i in range(1, len(parts), 2):
                  idx += 1
                  if idx == 2:
                      parts[i + 1] = re.sub(r'(id\s*=\s*)"[^"]*"', lambda m: m.group(1) + '"' + os.environ["PAGES_KV_ID"] + '"', parts[i + 1], count=1)
                      break
              text = "".join(parts)
          open(path, "w", encoding="utf-8").write(text)
          print(text)
          PY
        env:
          D1_ID: ${{ secrets.D1_ID }}
          IMAGES_KV_ID: ${{ secrets.IMAGES_KV_ID }}
          PAGES_KV_ID: ${{ secrets.PAGES_KV_ID }}

      - name: Set admin secrets
        run: |
          if [ -n "$FISHBLOG_ADMIN_USERNAME" ]; then
            printf '%s' "$FISHBLOG_ADMIN_USERNAME" | npx wrangler secret put ADMIN_USERNAME
          fi
          if [ -n "$FISHBLOG_ADMIN_PASSWORD" ]; then
            printf '%s' "$FISHBLOG_ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          FISHBLOG_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          FISHBLOG_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Deploy Worker
        run: npx wrangler deploy --domain blog.987998.xyz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
